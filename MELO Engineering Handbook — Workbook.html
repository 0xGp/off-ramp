# MELO Engineering Handbook

*Documentation-first engineering workspace for MELO, a crypto-to-fiat off-ramp protocol.*

**Current scope:** V1 supports USDC → NGN with **Arc Mainnet** as the only implemented settlement chain. The application and domain model must remain chain-agnostic so Base and Ethereum can be evaluated later.

## Start here
1. Read **AGENTS.md** before making changes.
2. Review **Project Status**.
3. Read the **Architecture Overview**.
4. Check the **Decision Register**.
5. Use the **Roadmap**.

<script type="text/markdown" id="src-agents">
# AGENTS.md — Engineering Rules

*These rules apply to human contributors and AI coding agents.*

## 1. Source of truth
- Read `README.md`, `START.md`, relevant layer docs, and applicable ADRs before editing.
- If docs conflict, do not silently choose. Record the conflict and request/raise a decision.
- Code is **not** considered approved merely because an agent generated it.
- Never turn `PROPOSED`, `UNDECIDED`, or `NEEDS_VALIDATION` into `VERIFIED` without evidence and an authorized review.

## 2. Architecture boundaries
- Keep domain logic chain-agnostic. Chain-specific RPC, addresses, confirmations/finality, token decimals, transaction encoding, and contract calls belong behind a **chain adapter**.
- V1 implements Arc only. Base and Ethereum are future adapters, not runtime dependencies.
- Provider-specific API payloads, auth, webhooks, error mappings, and retry semantics belong behind **provider adapters**.
- The backend coordinates; it must not be treated as authoritative proof of onchain escrow or fiat movement.
- A bank/provider is authoritative for fiat movement; Arc is authoritative for onchain escrow/settlement; the database is an application projection, not chain truth.
- Do not claim blockchain can independently verify a bank transfer.

## 3. Financial correctness
- Use integer base units / decimal-safe arithmetic. Never use JS floating-point `number` for token or fiat amounts in core calculations.
- Explicitly model token decimals per chain/token. Do not assume USDC always has 6 decimals — verify against current official docs and deployed token metadata before implementation.
- All financial state transitions must be idempotent and auditable.
- Enforce settlement/refund mutual exclusion and replay protection.
- Never release escrow solely because a backend row says `PAYMENT_VERIFIED`; enforce the contract's attestation/authorization policy onchain.
- Do not log secrets, private keys, full bank details, auth headers, or sensitive KYC data.

## 4. Integration discipline
- No provider is production-ready until legal/commercial access, supported corridor, chain/token compatibility, rate/quote semantics, payout lifecycle, webhook security, reconciliation, limits, and failure behavior are documented.
- Treat quote, reservation, payout, payment evidence, attestation, and settlement as **separate concepts**.
- Never assume a quote reserves liquidity.
- Handle stale quotes, duplicate webhooks, out-of-order events, provider timeouts, ambiguous payout outcomes, reversals, and reconciliation mismatches.
- External API behavior must be backed by official docs, partner confirmation, or reproducible sandbox evidence. Mark weaker evidence accordingly.

## 5. Change process
- For material architecture changes, create/update an ADR before or alongside implementation.
- Update the relevant docs and status register in the same change as code.
- Add tests for new state transitions, retries, idempotency, failure paths, and authorization boundaries.
- Avoid speculative abstractions. Build the smallest interface that preserves a documented extension seam.
- Do not introduce a new chain/provider/framework without recording rationale, trade-offs, operational cost, and rollback path.

## 6. Security and review
- Treat provider webhooks and backend messages as untrusted until authenticated and validated.
- Validate chain ID, contract address, token address, intent ID, amount, recipient, expiry, nonce, and attestation signer where applicable.
- Never store private keys in source control, `.env.example`, logs, or client bundles.
- Require human review for contract changes, custody changes, attestation policy changes, or settlement invariant changes.

## 7. Completion checklist
A task is not complete until:
- [ ] Acceptance criteria are met.
- [ ] Tests cover success, failure, retry, and duplicate delivery where applicable.
- [ ] Docs and status are updated.
- [ ] Observability and reconciliation implications are addressed.
- [ ] Security/privacy implications are reviewed.
- [ ] No unresolved assumption is represented as fact.

# START.md — First 30 Minutes

## Project snapshot
MELO is a documentation-first, hybrid crypto-to-fiat off-ramp protocol. V1 target: USDC → NGN, Arc Mainnet settlement, vetted payout partners, backend orchestration, and attestation-gated escrow settlement.

## Read in this order
1. `AGENTS.md`
2. Project Status
3. Architecture Overview
4. Intent Lifecycle
5. Provider Adapter Contract
6. Chain Adapter Contract
7. Decision Register

## Before coding
- Identify the layer and owner of the behavior.
- Find the corresponding contract/interface and ADR.
- Check whether the requirement is `APPROVED` or still proposed.
- Write acceptance criteria and failure cases.
- Ask for clarification if the task crosses an undecided trust boundary.

## First engineering milestone
Produce a reviewed **V1 vertical slice on testnet**:
1. Create intent and quote.
2. Authorize and escrow USDC.
3. Trigger a sandbox/provider payout.
4. Verify payment evidence through the defined attestation policy.
5. Release or refund through the escrow contract.
6. Reconcile chain, provider, and database records.
7. Demonstrate duplicate webhook, timeout, and ambiguous-payout handling.

> Do not use production funds or claim production readiness until the security, legal/commercial, and operational gates are satisfied.

<script type="text/markdown" id="src-doc-status">
# Document & Decision Status Vocabulary

Use one status per decision, requirement, integration claim, or document section.

| Status | Meaning | Allowed use |
|---|---|---|
| `IDEA` | Early thought; not yet shaped | Backlog/research |
| `PROPOSED` | Concrete candidate, not approved | Design discussion |
| `UNDECIDED` | Multiple viable options; decision owner/action needed | Decision register |
| `NEEDS_VALIDATION` | Plausible claim requiring evidence | Provider/chain research |
| `IN_REVIEW` | Ready for explicit technical/product review | PR/ADR review |
| `APPROVED` | Decision accepted by named reviewer/owner | Build against it |
| `IMPLEMENTED` | Code exists; may not be fully validated | Implementation tracking |
| `VERIFIED` | Acceptance evidence recorded and reviewed | Tested/confirmed claim |
| `DEPRECATED` | Superseded; retain for history | Historical record |
| `BLOCKED` | Cannot proceed until named blocker resolved | Roadmap |

`APPROVED` is a decision state; `VERIFIED` is an evidence state. A decision can be approved but not yet verified in a running implementation.

## Change log
- **2026-10-01:**
  - Frontend sign-in moved to Privy Google login with an embedded EVM wallet; RainbowKit removed (early part of backend phase 5).
  - Account setup comes first after sign-in: wallet, then a verified payout bank account, before the app or cash-out. The cash-out details step then pays the saved account and only asks for the amount.
- **2026-09-30:**
  - `MeloEscrow` v0.1 built and deployed to Arc Testnet and Base Sepolia.
  - Frontend switched to live Paycrest data and a two-chain picker.
  - ADR-0012 chose the Privy account-wallet intake over per-intent deposit addresses.
  - Backend phase 1 implemented: `/v1/me`, `/v1/banks`, `/v1/bank-accounts/verify`, `PUT /v1/me/bank-account`.
- **2026-09-30:** Paycrest selected as the development payout partner (hackathon; KYB letter pending). Option C treasury float on Base; Arc USDC rebalanced to Base in batches via CCTP (domain 26 → 6), never per intent.

## Scope baseline
- V1 target: USDC → NGN bank payout.
- Settlement chains in development: Arc Testnet and Base Sepolia. The mainnet chain set is `NEEDS_VALIDATION`; Arc mainnet status is unconfirmed.
- Payouts are funded from the MELO treasury on Base mainnet via Paycrest (ADR-0010 Option C); escrowed USDC releases to the treasury after attestation.
- Provider model: externally vetted/integrated partners, not an open permissionless solver market.
- Backend handles orchestration and application state; contract enforces crypto-side settlement constraints.
- Fiat movement is offchain and requires provider/bank evidence plus the approved attestation policy.

## Not yet verified
- LP onboarding, API credentials, commercial terms, actual NGN liquidity, and payout SLAs.
- Each LP's compatibility with escrow-first payout sequencing.
- Arc token address/decimals, contract deployment configuration, finality assumptions, and production RPC/indexer design.
- Attestor governance, signer custody, quorum, revocation, and dispute policy.
- Legal/regulatory operating model, KYC/AML obligations, and jurisdictional permissions.
- Contract audit and operational readiness.

## Gate to implementation
Layer contracts, ADRs, provider validation, threat model, and testable invariants must be reviewed before production implementation. Testnet/sandbox prototyping can proceed with clearly marked assumptions.

<script type="text/markdown" id="src-roadmap">
# Documentation-First Roadmap

1. **Foundation** — README, AGENTS, status model, scope, ADR process.
2. **Domain correctness** — intent aggregate, state machine, invariants, failure matrix.
3. **Trust/security** — trust boundaries, threat model, attestation governance, abuse cases.
4. **Integration contracts** — provider adapter, chain adapter, webhook contract, event/indexer contract.
5. **Data/API** — ERD, idempotency, API schemas, reconciliation model.
6. **Evidence** — validate Arc assumptions and shortlist LPs against primary sources/partner answers.
7. **Vertical-slice plan** — sandbox provider + Arc testnet; end-to-end acceptance tests.
8. **Implementation** — contract and backend first; frontend consumes stable API/state contract.
9. **Operational readiness** — monitoring, runbooks, incident response, deployment and rollback.
10. **Production gate** — legal/commercial clearance, security review/audit, reconciliation drills, operational sign-off.

## Current position (2026-09-30)
Steps 1–6 have working drafts. Step 7 is under way on Arc Testnet and Base Sepolia with Paycrest. Step 8: the contract is done; backend phase 1 of 6 (ADR-0012 build plan) is done, and phase 2 (quote + one-tap deposit) is next.

<script type="text/markdown" id="src-arch-overview">
# System Architecture Overview

## Responsibilities
- **Frontend** — Google sign-in via Privy, embedded account wallet and balance, saved bank account, quote review, one-tap cash-out, user-visible status/receipt (ADR-0012). Never decides settlement truth.
- **Backend/application** — intent orchestration, quote routing, provider adapters, policy evaluation, state machine, notifications, admin operations.
- **Database** — durable application records, idempotency, audit trail, projections. Not authoritative for chain or bank movement.
- **Provider/fiat layer** — NGN payout execution and provider-originated payment status/evidence.
- **Attestation layer** — validates evidence under policy and produces a cryptographic assertion; does not itself move fiat.
- **Chain adapter** — chain-specific RPC, contract bindings, transaction submission/receipt decoding, finality and token metadata.
- **Escrow contract** — onchain custody and release/refund constraints.
- **Indexer/reconciler** — observes chain events and compares chain/provider state against DB projections.

## Runtime outline
1. User requests quote for an amount and NGN destination.
2. Router gathers eligible provider quotes and normalizes them.
3. User reviews route and signs an intent authorization.
4. Chain adapter submits/observes escrow deposit on Arc.
5. Backend initiates provider payout according to the agreed partner settlement model.
6. Payment evidence is authenticated, reconciled, and attested.
7. Escrow contract validates attestation/authorization, then releases or refunds according to rules.
8. Indexer/reconciler updates projections; user receives a receipt.

## Trust boundaries
- User wallet signatures are untrusted input until verified.
- Provider webhooks are untrusted until signature/authentication and replay checks pass.
- Backend DB state is not a substitute for onchain verification.
- Attestation signer(s) are privileged and require key-management/governance controls.
- Chain adapter must validate chain ID, contract address, token address, and event provenance.
</script>

<script type="text/markdown" id="src-layer-contracts">
# Layer Contracts

| Layer | Owns | Must not own | Contract to adjacent layer |
|---|---|---|---|
| Frontend | UX, user intent, wallet interaction | Routing truth, fiat verification | Typed API client + wallet signer |
| API/Application | Use cases, authorization, state transitions | Private keys, fabricated chain/fiat truth | Domain commands/events |
| Domain | Intent rules, transition validation | HTTP/RPC/provider details | Pure types, policies, state machine |
| Provider adapters | Provider API translation | MELO-wide state policy | Normalized quote/payout/status |
| Chain adapter | Chain-specific transaction/read behavior | Provider/fiat business logic | Chain-neutral settlement port |
| Attestation | Evidence validation/signing | Direct fiat execution | Signed typed attestation |
| Persistence | Durable records/projections | Sole authority for external truth | Repository + inbox/outbox |
| Indexer/reconciler | Chain observation and drift repair | Initiating fiat payouts | Idempotent events/reconciliation findings |
</script>

<script type="text/markdown" id="src-intent-lifecycle">
# Intent Lifecycle

## Suggested states
`CREATED → ROUTING → QUOTE_AVAILABLE → USER_APPROVAL_REQUIRED → ESCROW_PENDING → ESCROWED → FIAT_PAYMENT_PENDING → PAYMENT_DETECTED → PAYMENT_VERIFYING → PAYMENT_VERIFIED → RELEASE_PENDING → SETTLED`

Failure/exception states: `NO_ROUTE`, `QUOTE_EXPIRED`, `ESCROW_FAILED`, `PAYOUT_FAILED`, `PAYMENT_TIMEOUT`, `PAYMENT_VERIFICATION_FAILED`, `DISPUTED`, `REFUND_PENDING`, `REFUNDED`, `RECONCILIATION_REQUIRED`.

## Modeling rules
- Persist state transitions as append-only audit events, with a current-state projection.
- Every transition has a command/event source, timestamp, correlation ID, and idempotency scope.
- Distinguish intent status from provider payout status and onchain escrow status.
- Do not mark `SETTLED` until the chain event/receipt is verified and the corresponding fill is reconciled.
- For split fills, define per-fill state and aggregate intent state before enabling partial execution.
- Timeout triggers must be deterministic; backend cron is a convenience, not the only refund safety mechanism.
</script>

<script type="text/markdown" id="src-invariants">
# Protocol Invariants

*Require contract/domain review.*

1. Crypto cannot be released unless the configured payment-verification policy is satisfied.
2. A refunded escrow cannot later be released.
3. A settled fill cannot be settled again.
4. Amount, token, chain, recipient, intent ID, nonce, and expiry are bound to the authorization/attestation.
5. Backend database status alone cannot authorize release.
6. Expired or invalid attestations cannot release escrow.
7. Provider payout retries must not create duplicate fiat transfers.
8. Every external side effect is idempotent or has an explicit ambiguity/reconciliation procedure.
9. The protocol must define who can trigger expiry/refund and under which exact conditions.
10. Partial fills cannot cause aggregate over-release or over-refund.
</script>

<script type="text/markdown" id="src-glossary">
# Domain Glossary

- **Intent** — User's request to exchange a specified crypto amount for fiat under stated conditions.
- **Quote** — Time-bounded price/terms offer; not necessarily a liquidity reservation.
- **Reservation** — Provider-confirmed temporary hold of execution capacity, if supported.
- **Fill** — Accepted allocation/execution of some or all of an intent.
- **Payout** — Fiat transfer instruction to the recipient.
- **Payment evidence** — Provider/bank artifacts used to determine payout outcome.
- **Attestation** — Signed claim that specified evidence met a defined verification policy.
- **Escrow** — Onchain contract-held crypto governed by protocol rules.
- **Settlement** — Final onchain release/refund for a fill.
- **Reconciliation** — Comparing MELO records with provider/bank and chain sources of truth and resolving mismatches.
</script>

<script type="text/markdown" id="src-failure-modes">
# Failure Modes & Recovery Matrix

| Failure | Required behavior |
|---|---|
| No eligible quote | Return `NO_ROUTE`; do not create escrow |
| Quote expires before authorization | Require refreshed quote |
| Escrow tx pending/failed | Do not initiate payout until escrow verified |
| Provider API timeout before known acceptance | Query by idempotency/reference; mark `UNKNOWN` if ambiguous |
| Duplicate webhook | Deduplicate; no duplicate payout/state transition |
| Payout pending beyond SLA | Keep pending/unknown, reconcile; do not infer success |
| Payout failed/reversed | Follow approved refund/dispute policy; prevent release |
| Attestation invalid/expired | Reject release; surface operational exception |
| Chain RPC/indexer outage | Preserve durable intent; retry reads safely; avoid duplicate writes |
| Backend unavailable | Contract's expiry/refund safety path remains available under approved rules |
| Chain/provider/database disagree | Mark `RECONCILIATION_REQUIRED`; no blind manual settlement |
</script>

<script type="text/markdown" id="src-chain-adapter">
# Chain Adapter Contract

## Design goal
Expose chain-neutral settlement operations while V1 implements Arc only. Do not leak Arc SDK/RPC details into domain services.

## Illustrative port
```ts
type ChainId = "arc"; // Extend only after chain onboarding ADR.
type Hex = `0x${string}`;

interface ChainSettlementAdapter {
  getEscrowState(intentId: string): Promise<EscrowState>;
  submitDeposit(input: DepositCommand): Promise<ChainTxSubmission>;

  submitRefund(input: RefundCommand): Promise<ChainTxSubmission>;
  getTransactionStatus(txHash: Hex): Promise<ChainTxStatus>;
  decodeEscrowEvent(log: unknown): EscrowDomainEvent | null;
}
```
*This is illustrative, not a final ABI. Finalize only after contract interface and Arc deployment details are approved.*

## Required chain configuration
- Chain ID and environment
- RPC endpoints and failover policy
- Escrow contract address and ABI version
- USDC token address and decimals
- Finality/confirmation policy
- Explorer URL
- Indexer cursor/reorg strategy
- Gas/fee policy and transaction replacement behavior

## Future chain onboarding gate
A Base/Ethereum adapter requires a new ADR, chain/token/contract verification, deployment and finality assumptions, monitoring, test suite, and explicit product approval. A generic interface alone does not make a chain integration safe.

<script type="text/markdown" id="src-provider-adapter">
# Provider Adapter Contract

## Provider abstraction
```ts
interface LiquidityProviderAdapter {
  getQuote(request: QuoteRequest): Promise<NormalizedQuote>;
  checkAvailability(quoteId: string): Promise<AvailabilityResult>;
  createPayout(request: PayoutRequest): Promise<PayoutResult>;
  getPayoutStatus(providerOrderId: string): Promise<PayoutStatus>;
  verifyWebhook?(request: WebhookRequest): Promise<VerifiedProviderEvent>;
}
```
Methods are a starting point; adapt to partner capabilities and avoid pretending every partner supports the same lifecycle.

## Normalized quote fields
`providerId`, `providerQuoteId`, `inputAsset`, `inputAmountBaseUnits`, `fiatCurrency`, `fiatAmountMinorUnits`, `feeBreakdown`, `rate`, `limits`, `expiresAt`, `reservationSemantics`, `settlementRequirements`.

## Adapter requirements
- Map provider errors into stable MELO error categories without losing raw diagnostic context.
- Preserve provider reference IDs and idempotency keys.
- Verify webhook signatures, timestamp tolerance, and replay protection.
- Model `PENDING`, `SUCCEEDED`, `FAILED`, `REVERSED`, and `UNKNOWN` distinctly where supported.
- Do not infer success from HTTP 200 or an accepted payout request.
- Provide reconciliation lookup and operational contact/escalation procedure.
</script>

<script type="text/markdown" id="src-attestation-contract">
# Attestation Contract

*Status: `UNDECIDED`*

## Required design questions
- What exact fact does the attestation assert: payout initiated, bank-accepted, beneficiary-credited, or irreversibly settled?
- Which evidence is admissible, and who can inspect/verify it?
- Single signer, threshold signatures, or independent quorum?
- How are signer keys secured, rotated, revoked, and audited?
- How are intent ID, fill ID, token/amount, NGN amount, recipient commitment, provider reference, expiry, and nonce bound?
- How are reversals, disputes, conflicting evidence, and late events handled?
- Can contract policy be updated, by whom, and under what timelock/emergency process?

> Do not implement an attestation scheme until the asserted payment condition and trust model are explicit.

<script type="text/markdown" id="src-lp-selection">
# LP Selection & Partner Due Diligence

*Status: `NEEDS_VALIDATION` · Decision: No V1 LP selected.*

## Evaluation dimensions
- NGN bank payout coverage and supported beneficiary types.
- Direct business/API onboarding and commercial availability.
- USDC networks/token contracts supported; Arc support specifically.
- **Escrow-first compatibility**: can payout be initiated from confirmed escrow without prior transfer into provider custody?
- Executable quote semantics, quote expiry, reservation/availability behavior.

- Payout lifecycle statuses, reversal handling, reconciliation API, webhook authenticity.
- Idempotency, retry safety, incident escalation, uptime/operational reporting.
- Compliance/KYB/KYC/AML responsibilities, licensing and jurisdictional coverage.
- Commercial terms, prefunding/collateral requirements, settlement timing.

## Candidate shortlist
| Candidate | Official site | Docs | Note |
|---|---|---|---|
| Partna | getpartna.com | docs.getpartna.com | Potential stablecoin/fiat ramp and NGN payout partner |
| Yellow Card | yellowcard.io/api | docs.yellowcard.engineering | Stablecoin/fiat infra and local payout partner |
| Daya | daya.co | daya.co/blog (dev guide) | Stablecoin/NGN payout API partner |
| Liquidramp | liquidramp.com | liquidramp.com | Liquidity aggregation/off-ramp infra |

| Paycrest | paycrest.io | docs.paycrest.io | Onchain aggregator (Gateway escrow + provider network); NGN/KES/TZS/UGX; no Arc; no sandbox |
| HoneyCoin | honeycoin.app | docs.honeycoin.app | Off-ramp API with NG/bank payouts; **deposit-address (provider custody) model; Arc not in chain list** |

*All candidates are `NEEDS_VALIDATION`. None are integrated or commercially confirmed. See the Research section for the per-provider validation checklist and the Arc chain-validation page.*

## Fit against the escrow-first model (desk research, 2026-09-30)
*Status: `NEEDS_VALIDATION`. Source: public docs only; no partner has confirmed terms.*

Under ADR-0010 Option C, the user's USDC stays in `MeloEscrow`. MELO pays NGN from a **prefunded partner balance**, the attestor signs the final provider outcome, and escrow releases to the MELO treasury. The treasury tops the partner balance back up in batches, via CCTP from Arc (domain 26) if the partner has no Arc support. So the hard requirement is a **payout-from-balance API with a unique reference**. Arc support only affects treasury top-ups. A deposit-first flow (send crypto to a provider address per transaction) does not fit.

| Candidate | Payout from balance | Idempotency | Webhooks / sandbox | Arc | Fit |
|---|---|---|---|---|---|
| Partna | `Withdraw` from the payout balance to an NGN bank (avoid the deposit-first `/v4/ramp` offramp) | Unique `transactionReference` | Signed webhooks with `sessionId`; staging with mock deposits (access after onboarding form + call) | Not listed (ETH, Celo, Solana, Tron) | Primary candidate |
| Yellow Card | Prefund the USD vault, then `/send` via the bank channel | Sequence ID + lookup | Signed webhooks; sandbox | No (USDC top-up on ETH, Base, Solana, Stellar, Celo) | Backup; NG requires full KYC incl. NIN + BVN, no reduced tier |
| Daya | `POST /v1/transfers` (NGN) | `Idempotency-Key` header | `X-Daya-Signature`; sandbox | No (Tempo) | Promising; thinner public docs |
| Liquidramp | Unclear (P2P aggregator; LPs use approve-to-spend contracts) | Unknown | No public API docs found | Announced Arc testnet | Discovery call; possible Option A fit; CBN sandbox applicant |
| Paycrest | Per-order USDC deposit into its onchain Gateway escrow, then the provider pays NGN and the Gateway releases to the provider (refund to `refundAddress` on failure). Fits Option C with a **USDC float**: the MELO treasury funds each order, the user's USDC stays in `MeloEscrow` | `reference` field exists; uniqueness not documented (`NEEDS_VALIDATION`) | HMAC-SHA256 `X-Paycrest-Signature`, 24h retries plus replay API; **no sandbox** (production, min ~$0.50); KYB required for API key | No (live `/v2/rates/arc/...` returns "not supported"); USDC on Base, Arbitrum, Polygon, Ethereum, Celo, Solana and others; NGN supported with public rates | Strong candidate for testnet self-test and V1 |
| HoneyCoin | No (deposit address) | — | — | No | Not V1 |
| Transak | Consumer widget; sell flow means user pays crypto into Transak (conflicts with escrow-first) | — | Staging `api-stg.transak.com`; price/orders need partner key or access token | USDC on Arc listed (`0x3600…0000`) with `isPayInAllowed: false`, i.e. sell not supported (public API, 2026-09-30) | Not V1; NGN absent from the unauthenticated fiat list (may be partner-filtered, `NEEDS_VALIDATION`) |

### Partner questions (ask all)
1. Can MELO pay out from a prefunded balance as B2B, without an account per end user? What KYC data is required per payout?
2. Is pay-first (Option A) supported, with the partner paid by escrow release afterwards?
3. Which statuses are final? What is the reversal/recall window after "success"?
4. What are the idempotency guarantees on payout create (duplicate reference behavior, safe retry after timeout)?
5. Webhook signing scheme, retry policy, and a status-query endpoint for reconciliation?
6. Float/collateral minimums, top-up networks, and settlement timing?
7. Arc mainnet support or roadmap?

## Development partner decision (2026-09-30)
*Status: `DECIDED` for development; not a V1 production selection.*

**Paycrest** is the development payout partner, used in its documented developer mode: production API, small real amounts (no sandbox exists). Escrow runs on Arc Testnet and Base Sepolia; Paycrest orders run on **Base mainnet**, funded from a small MELO dev treasury wallet (Option C, USDC float).

- **Blocker:** Sender API key requires KYB at app.paycrest.io. Individual-developer access requested (`NEEDS_VALIDATION`).
- **Usable without a key:** `GET /v2/rates/{network}/USDC/{amount}/NGN` (quotes), `GET /v2/institutions/NGN` (bank list; Paycrest codes such as `GTBINGLA`, not NIBSS codes), `GET /v2/currencies`, `GET /v2/tokens`.
- **Order mapping:** `POST /v2/sender/orders` with `source {crypto, USDC, base, refundAddress = dev treasury}`, `destination {fiat, NGN, recipient {institution, accountIdentifier, accountName, memo}}`, `reference = intentId`. The treasury sends `amountToTransfer` to `receiveAddress` before `validUntil`.
- **Outcome mapping for attestation:** `settled` → `PAYOUT_SUCCEEDED`; `refunded` → `PAYOUT_FAILED`; `expired` (treasury did not fund) → not a payout outcome, re-create or fail the intent; `deposited`/`pending`/`validated`/`settling`/`refunding` → in progress, no signature.
- **Cost:** every test spends real USDC (`amount + senderFee + transactionFee`, min ≈ $0.50) while the escrow releases only testnet USDC. Keep the dev treasury small and capped.
- **Until the key arrives:** develop against the `SimulatedProvider` with Paycrest-shaped webhooks and wire the keyless rates and bank-list endpoints into the app.

## Self-test path (testnet, no partner onboarding)
*Status: `PROPOSED`.*

Arc Testnet USDC comes from the Circle faucet and has no value, so no partner will pay real NGN against it. For a founder self-test, keep the partner behind the provider adapter interface and swap implementations:

| Stage | Provider adapter | Onboarding | What it proves |
|---|---|---|---|
| 1 | `SimulatedProvider`, in-repo; emits signed webhooks with a configurable outcome (success, failed, unknown, delayed) | None | Escrow → attestation → release/refund end to end, plus the failure paths |
| 2 | Paystack or Flutterwave **test mode** transfers API | Self-serve test keys at signup (`NEEDS_VALIDATION`) | Real NGN payout API shape: recipient/transfer create, webhooks, status query, idempotent reference |
| 3 | `ManualOperatorProvider`: the operator pays themselves from a personal bank app and records the bank reference; the attestor signs on operator confirmation | None | Real NGN leg with MELO acting as its own LP (Option C) |
| 3b | Paycrest production with tiny amounts: the treasury wallet on Base funds each order with real USDC and the NGN lands in the operator's own bank account | KYB at app.paycrest.io | Real partner, real NGN, real webhooks, while Arc escrow runs on testnet |
| 4 | Partna staging (then Yellow Card sandbox) | Onboarding form + call | Target partner integration |

**Hackathon constraint (no registered business):** Paystack live Transfers are for Registered Businesses only; Starter (unregistered) accounts get "You cannot initiate third party payouts as a starter business". Paystack **test mode** transfers work without registration, but always return `success`, so failure and refund paths must come from `SimulatedProvider` (for example, a demo magic account number that forces `failed`). Paycrest and Partna also need KYB. Hackathon demo = Arc Testnet escrow + Paystack test-mode payouts (+ simulated failures), with an optional stage 3 manual real-naira run.

The stage 3 threshold-1 manual attestation is testnet only and never carries over to mainnet (see ADR-0006). Live payout accounts on Paystack or Flutterwave require business activation, and operating Option C with real users requires legal/licensing review.

## Selection rule
Do not rank providers from marketing claims alone. Select a primary and backup only after direct diligence, sandbox evidence, technical fit review, commercial/legal review, and an approved scorecard. Provider selection does not replace ongoing liquidity/health monitoring.

<script type="text/markdown" id="src-data-model">
# Data Model (Conceptual)

**Core entities:** `User`, `Intent`, `Quote`, `Fill`, `Provider`, `Payout`, `PaymentEvidence`, `Attestation`, `Settlement`, `OnchainTransaction`, `IdempotencyRecord`, `AuditEvent`, `WebhookInbox`, `OutboxEvent`.

## Modeling notes
- Use immutable internal IDs; store external provider IDs separately with uniqueness constraints scoped by provider.
- Store money as integer base units/minor units plus explicit asset/currency/decimals metadata.
- Keep intent-level aggregate separate from fill-level execution records.
- Persist raw provider payloads only when necessary, access-controlled and redacted; store normalized fields for application use.
- Keep an append-only audit trail for privileged actions and state transitions.
- Track chain ID, contract address, tx hash, log index, block number/hash, and confirmation/finality status.
- Add uniqueness constraints for idempotency keys and provider webhook event IDs.
- Define retention, encryption, access control, and PII minimization before production.
</script>

<script type="text/markdown" id="src-idempotency">
# Idempotency & Reconciliation

## Idempotency scopes
- **Client command** — user + operation + idempotency key.
- **Provider payout** — MELO fill ID + provider.
- **Webhook** — provider + provider event ID.
- **Chain event** — chain ID + tx hash + log index.
- **Settlement command** — intent/fill ID + action + nonce.

## Reconciliation loops
- **Chain** — compare escrow contract state/events to MELO settlement projection.
- **Provider** — query unresolved or stale payout references.
- **Database** — detect state transitions missing corresponding external evidence.
- **Attestation** — verify signer, payload binding, expiry, and revocation policy.

> Never blindly retry an ambiguous fiat payout. Query provider status or escalate to reconciliation before retrying.
</script>

<script type="text/markdown" id="src-api-principles">
# API Contract Principles

- Publish versioned OpenAPI schemas before frontend integration.
- Separate commands from queries; return stable domain status plus timestamps and references.
- Use idempotency keys for side-effecting requests.
- Return typed errors: `validation`, `quote-expired`, `no-route`, `provider-unavailable`, `payout-unknown`, `chain-pending`, `attestation-rejected`, `reconciliation-required`.
- Never expose provider credentials, attestor secrets, internal risk signals, or unnecessary PII.
- Treat frontend polling/websocket messages as projections; backend must derive status from verified sources.
- Include correlation ID and request ID for support/debugging.
</script>

<script type="text/markdown" id="src-openapi">
# OpenAPI Contract v0.1

```
Status: PROPOSED
Date: 2026-09-30
Related: API Contract Principles, Endpoint Inventory, ADR-0003, ADR-0008
Source of the shapes: web/lib/api/types.ts (frontend MeloApi)
```

## Conventions
- **Money** is integer base units carried as decimal strings (`"120000000"` = 120 USDC at 6 decimals). Decimals are always sent alongside.
- **Errors** use one envelope: `{ "error": { "code", "message", "requestId" } }`. `code` is one of the typed errors in API Contract Principles, plus `not-found`, `unauthorized` and `conflict`.
- **Headers:**
  - `Idempotency-Key` is required on every side-effecting `POST`.
  - `X-Correlation-ID` is optional; the server generates one if missing and echoes it back.
  - `X-Request-ID` is returned on every response.
- **Auth:** Sign-In with Ethereum (EIP-4361) creates an HTTP-only session cookie. Every intent is owned by the signed-in wallet address, and cross-owner access returns `not-found`.
- **Status** values are backend projections; clients never assert escrow or payout state.

## Flow change vs. the frontend prototype
The prototype signs one EIP-712 message. Under ADR-0003 Option A:
1. `POST /authorization` locks the quote and returns **MELO-signed deposit terms**.
2. The wallet sends `approve` (if needed), then `MeloEscrow.deposit(terms, meloSignature)`.
3. The client may send the tx hash to `/deposit-hint`. This is only an untrusted hint; the indexer confirms.

The frontend's `QuoteOffer.authorization` and `AuthorizeIntentRequest` change accordingly. `CreateIntentRequest.walletAddress` is dropped: the owner and depositor come from the SIWE session.

## Schema

```yaml
openapi: 3.1.0
info:
  title: MELO Off-Ramp API
  version: 0.1.0-draft
servers:
  - url: https://api.testnet.melo.example/v1   # placeholder
security:
  - session: []

paths:
  /auth/nonce:
    post:
      summary: Issue a SIWE nonce
      security: []
      responses:
        "200": { description: Nonce, content: { application/json: { schema: { $ref: "#/components/schemas/SiweNonce" } } } }
  /auth/siwe:
    post:
      summary: Verify a SIWE message and start a session
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SiweVerifyRequest" } } }
      responses:
        "204": { description: Session cookie set }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: End the session
      responses: { "204": { description: Logged out } }

  /banks:
    get:
      summary: Supported NGN payout banks
      responses:
        "200": { description: Banks, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Bank" } } } } }
  /recipients/resolve:
    post:
      summary: Resolve an account name (NUBAN lookup via provider)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Recipient" } } }
      responses:
        "200": { description: Resolved, content: { application/json: { schema: { $ref: "#/components/schemas/ResolvedRecipient" } } } }
        "422": { $ref: "#/components/responses/Error" }

  /intents:
    post:
      summary: Create an intent (no quote, no funds)
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateIntentRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedIntent" } } } }
        "422": { $ref: "#/components/responses/Error" }

  /intents/{id}/quotes:
    post:
      summary: Request a fresh quote (replaces any previous unlocked quote)
      parameters: [ { $ref: "#/components/parameters/IntentId" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      responses:
        "200": { description: Quote, content: { application/json: { schema: { $ref: "#/components/schemas/Quote" } } } }
        "409": { description: "no-route | provider-unavailable | conflict (already authorized)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /intents/{id}/authorization:
    post:
      summary: Lock the quote and issue MELO-signed deposit terms (ADR-0003)
      parameters: [ { $ref: "#/components/parameters/IntentId" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AuthorizeIntentRequest" } } }
      responses:
        "200": { description: Deposit instructions, content: { application/json: { schema: { $ref: "#/components/schemas/DepositInstructions" } } } }
        "409": { description: "quote-expired | conflict", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /intents/{id}/deposit-hint:
    post:
      summary: Untrusted hint that a deposit tx was sent; speeds up indexing only
      parameters: [ { $ref: "#/components/parameters/IntentId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [txHash], properties: { txHash: { $ref: "#/components/schemas/Hex32" } } } } }
      responses: { "202": { description: Accepted for indexing } }

  /intents/{id}:
    get:
      summary: Intent projection (poll every ~2s until terminal)
      parameters: [ { $ref: "#/components/parameters/IntentId" } ]
      responses:
        "200": { description: Intent, content: { application/json: { schema: { $ref: "#/components/schemas/IntentView" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /intents/{id}/receipt:
    get:
      summary: Receipt, only when status is SETTLED
      parameters: [ { $ref: "#/components/parameters/IntentId" } ]
      responses:
        "200": { description: Receipt, content: { application/json: { schema: { $ref: "#/components/schemas/IntentView" } } } }
        "409": { description: Not settled, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /activity:
    get:
      summary: Caller's intents, newest first
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/IntentView" } }
                  nextCursor: { type: [string, "null"] }

  /webhooks/providers/{provider}:
    post:
      summary: Provider webhook (signature-verified, inbox-deduplicated; ADR-0008)
      security: []
      parameters: [ { name: provider, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: Stored (or duplicate) }
        "401": { description: Bad signature or timestamp }

<script type="text/markdown" id="src-threat-model">
# Threat Model

## Assets
Escrowed USDC, payout funds, user authorization, attestor keys, provider credentials, personal/bank data, protocol state, admin access.

## Threat actors / failure sources
Malicious user, compromised provider account, forged/replayed webhook, compromised backend, malicious/compromised attestor, admin misuse, RPC/indexer inconsistency, chain congestion/reorg, provider outage or ambiguous payout.

## Key mitigations to design
- Contract-enforced amount/token/recipient/intent/expiry/nonce binding and replay protection.
- Attestor key custody, rotation, threshold/quorum policy, revocation, and auditability.
- Provider webhook signature verification, replay windows, inbox deduplication.
- Least-privilege provider/admin credentials and secrets manager.
- Contract pause/emergency policy with documented authority and recovery.
- Independent reconciliation across provider and chain sources.
- Rate limits, abuse monitoring, sanctions/KYC policy review, PII minimization.
- Explicit refund/dispute path and tests for every terminal-state race.

## Open questions
Attestor trust model, emergency authority, dispute adjudication, provider prefunding model, contract upgradeability, and legal/compliance allocation remain undecided.
</script>

<script type="text/markdown" id="src-observability">
# Observability & Operations

## Correlation keys
`intentId`, `fillId`, `providerOrderId`, `providerEventId`, `chainId`, `txHash`, `attestationId`, `correlationId`.

## Metrics
- Quote success/latency by provider
- Quote-to-payout conversion
- Payout success/failure/unknown/reversal rates
- Time in each intent state
- Attestation rejection/latency
- Escrow pending duration and settlement/refund outcomes
- Provider API/webhook health
- Chain RPC/indexer lag and reconciliation mismatch count

## Alerts
Stuck escrow, payout outcome unknown beyond threshold, duplicate payout attempts, attestation signer failures, provider webhook silence, indexer lag, settlement/refund mismatch, elevated provider failures.

> Never log secrets or full bank details. Define severity thresholds and on-call ownership before production.
</script>

<script type="text/markdown" id="src-recon-runbook">
# Reconciliation Runbook (Template)

1. Identify affected intent/fill and freeze unsafe automatic retries.
2. Gather chain state, tx receipts/logs, provider payout status, payment evidence, attestation record, and audit events.
3. Determine authoritative source for each disputed fact.
4. Classify: delayed, duplicate, failed, reversed, mismatched, or unknown.
5. Do not manually mark settled/refunded without the required external evidence and approved authority.
6. Apply an idempotent repair command or escalate to dispute/incident process.
7. Record root cause, impact, corrective action, and prevention test.
</script>

<script type="text/markdown" id="src-test-strategy">
# Test Strategy

- **Unit** — domain transitions, amount math, quote normalization, policy checks.
- **Property/invariant** — no double release/refund, no amount overrun, invalid/expired attestation rejected.
- **Contract** — fuzzing, invariant tests, access-control tests, replay tests, timeout/refund races.
- **Adapter contract tests** — provider sandbox fixtures, signature verification, error mapping, idempotency.
- **Integration** — Postgres transactions, inbox/outbox, indexer replay, reconciliation.
- **End-to-end** — quote → authorization → escrow → payout → attestation → settlement/refund.
- **Chaos/failure** — duplicate/out-of-order webhook, provider timeout, RPC outage, delayed chain event, ambiguous payout, backend restart.
- **Security** — dependency, secret scanning, static analysis, independent contract review/audit before production.
</script>

<script type="text/markdown" id="src-acceptance-criteria">
# V1 Acceptance Criteria (Draft)

- User can obtain an executable, time-bounded quote with explicit net NGN and fees.
- User explicitly authorizes the intent and exact parameters.
- Escrow deposit is independently verified on the configured chain.
- Provider payout is initiated exactly once or enters an explicit unknown/reconciliation state.
- Payment verification follows an approved evidence and attestation policy.
- Contract rejects invalid, expired, mismatched, or replayed settlement authorization.
- Refund and release are mutually exclusive and race-tested.
- User/admin status is derived from reconciled backend projections.
- Duplicate events and retries do not duplicate payout or settlement.
- Runbook can reconcile a deliberately injected ambiguous payout.
</script>

<script type="text/markdown" id="src-frontend-boundary">
# Frontend Boundary

Frontend is a consumer of MELO's API and wallet/chain adapter. It must not encode provider-specific behavior or treat optimistic UI as settlement truth.

## User flow (ADR-0012)
- **First time:** sign in with Google (Privy) → account wallet created → save bank account after the name check → "Add USDC" shows her address and QR for Arc or Base.
- **Each cash-out:** choose "USDC on Arc / USDC on Base" → amount → quote (net NGN, fees, expiry) → one tap: the embedded wallet deposits into `MeloEscrow` → payout processing → verification → settlement/receipt.
- No external wallet connection, network switching or signing pop-ups.

## Current prototype (`web/`)
- Live Paycrest data via server routes `/api/paycrest/{institutions,rate,verify-account}`; the API key never reaches the browser.
- Two-chain picker with the USDC logo; escrow addresses in `lib/chains.ts`.
- Sign-in: Privy Google login (direct redirect, no method picker) creates the embedded EVM wallet; wagmi runs through `@privy-io/wagmi`, and the wallet follows the selected chain without a prompt. The app creates the wallet itself if Privy's `createOnLogin` didn't.
- Account setup (`/account/setup`): every page except the landing page redirects there until `/v1/me` reports onboarding complete (wallet, then a payout bank account verified by name). The same page changes the payout account later (fresh sign-in, 24 h cooldown).
- Cash-out details with a saved account: amount only, plus a "Pays to" card; the full account number never reaches the browser.
- The account menu shows the Google email, the wallet address and the saved payout bank from the backend's `/v1/me`, sent with the Privy access token.
- Still mock: quote, deposit and tracking (backend phases 2–4). `web/.npmrc` relaxes npm peer resolution because Privy lists optional peers that conflict with wagmi's; viem is pinned to 2.56.0 to match `@privy-io/wagmi`.

## UI requirements
- Clearly distinguish quote, authorization, escrowed, payout pending, payment verified, settled, failed, refunded, and needs-attention.
- Display chain/network and token explicitly.
- Explain what the user signs and what escrow does.
- Avoid implying fiat payment is verified until backend evidence/attestation policy confirms it.
- Provide stable activity/receipt references and support path.
- Responsive minimal fintech UI; avoid exposing unnecessary LP complexity.
</script>

<script type="text/markdown" id="src-deployment">
# Deployment & Runtime Decisions

*Status: testnet contracts deployed; backend topology `PROPOSED`; production `UNDECIDED`.*

## Testnet deployments (2026-09-30)

| Chain | Chain ID | `MeloEscrow` | USDC | Deploy block |
|---|---|---|---|---|
| Arc Testnet | 5042002 | [`0x8C4D6fDe62399ffAC59f94748aD7971d146D7C85`](https://explorer.testnet.arc.io/address/0x8C4D6fDe62399ffAC59f94748aD7971d146D7C85) | `0x3600000000000000000000000000000000000000` | 64794401 |
| Base Sepolia | 84532 | [`0x8C4D6fDe62399ffAC59f94748aD7971d146D7C85`](https://sepolia.basescan.org/address/0x8C4D6fDe62399ffAC59f94748aD7971d146D7C85) | `0x036CbD53842c5426634e7929541eC2318f3dCF7e` | 47506703 |

- The address is the same on both chains because it was the deployer's first transaction on each.
- Owner, quote signer and single attestor (threshold 1) are the testnet deployer `0x10Ede187d03D651fc68f62a2d6501F67A6e93a86`. Rotate them via `setQuoteSigner`, `setAttestor` and `transferOwnership` before any real value.
- Source of truth: `contracts/deployments/<chainId>.json`, exported to `contracts/exports/addresses.ts`.

## Backend topology (PROPOSED)
- **Modular monolith, two processes from one codebase:** `api` (Fastify HTTP) and `worker` (jobs on Postgres via graphile-worker). They split only when scaling or isolation requires it.
- **PostgreSQL** is the only stateful dependency (no Redis). Migrations are versioned SQL, and money columns are `numeric`/integer minor units only.
- **Secrets:** Privy app secret, Paycrest keys, data-encryption key and signer keys come from the environment locally and a secret manager/KMS in deployed environments; never committed.
- **Environments:** local (Docker Postgres), testnet (Arc Testnet + Base Sepolia, Paycrest production with small amounts), production `UNDECIDED`.

## Required decisions
- Monolith modular backend vs separately deployed services
- PostgreSQL hosting, backups, PITR, encryption, migration strategy
- Queue/outbox/inbox technology and delivery guarantees
- Secret manager/KMS/HSM and attestor key custody
- RPC provider redundancy and indexer deployment
- Worker scheduling, retries, dead-letter handling
- Environments: local, CI, testnet/sandbox, staging, production
- Infrastructure-as-code, deployment approvals, rollback and incident access

> Avoid premature microservices. Split deployables only when scaling, isolation, team ownership, or reliability requirements justify the operational cost.
</script>

<script type="text/markdown" id="src-arc-onoff-ramp">
# Arc — On/Off-Ramp Integration

*Status: `NEEDS_VALIDATION` · Evidence class: official public docs · Accessed: 2026-09-29*

**Source:** [On/off-ramp integration — Arc Docs](https://docs.arc.io/integrate/on-off-ramps.md) · Follow-up guide: [Add Arc to your on/off-ramp platform](https://docs.arc.io/integrate/on-off-ramps/add-arc-to-your-platform)

## Summary
On/off-ramp platforms on Arc use USDC for both transfers and gas — no ETH float is required. Arc's sub-second finality removes the multi-confirmation wait required on other EVM chains.

## Key differences for ramp platforms
| Concern | Arc behavior | Impact on MELO |
|---|---|---|
| **USDC as native gas token** | Gas is paid in USDC; no separate ETH/gas token | Single USDC asset entry per address. No ETH float for gas; users don't need a second token |
| **Deterministic finality** | Transactions finalize in under one second; no reorgs | Complete sell orders after 1 confirmation. Remove block-countdown / multi-confirmation logic from the chain adapter's finality policy |
| **Two decimal views, one balance** | Native USDC uses **18 decimals** (`eth_getBalance`, EIP-7708 events); ERC-20 interface uses **6 decimals** (`balanceOf`). Both draw from the same balance | Filter Transfer events on the native system emitter (`0xffff…fffe`) and divide the 18-decimal `value` by 10^12 for display. Use 6-decimal values for withdrawals |

## Testnet parameters (from docs)
| Requirement | Value |
|---|---|
| RPC | `https://rpc.testnet.arc.io` |
| Chain ID | `5042002` (testnet) |
| USDC ERC-20 contract | `0x3600000000000000000000000000000000000000` |
| CCTP domain | `26` (crosschain USDC routing) |

*These are **testnet** values only. Mainnet chain ID, RPC, and USDC address remain unverified — see Arc Validation.*

## Behaviors that affect ramp operations
- **Blocklist enforcement** — Transactions from/to blocklisted addresses are rejected before the mempool. Transfers involving a blocked address revert at runtime and still consume gas. **Screen destination addresses before broadcasting.**
- **EIP-7708 Transfer events** — Every native USDC movement emits an ERC-20 `Transfer` event from system emitter `0xffff…fffe`. Filtering only on the ERC-20 contract address misses native sends.

## Implications for MELO design
- **Chain adapter** — Model decimals per interface (18 native vs 6 ERC-20), not per token. Amount conversion must use integer base units; never floating-point.
- **Indexer/reconciler** — Subscribe to both the USDC ERC-20 contract and the native system emitter, or deduplicate if both emit for the same movement.
- **Finality policy** — 1-confirmation finality simplifies `ESCROW_PENDING → ESCROWED`, but still verify the receipt/event before transitioning.
- **Gas/fee policy** — Relayer/attestor wallets need a USDC balance for gas; no separate native-token treasury.
- **Compliance** — Add pre-broadcast blocklist screening for refund/release recipients so a blocked address doesn't cause a reverted, gas-consuming settlement.
- **Crosschain** — CCTP domain `26` is relevant if Base/Ethereum adapters are onboarded later (future scope, requires ADR).

## Remaining unknowns
- Mainnet parameters (chain ID, RPC, USDC address, CCTP domain).
- Whether escrow contracts receiving USDC via the ERC-20 interface vs native send need separate handling.
- Blocklist source/API for pre-broadcast screening.
- RPC rate limits and indexing options for production.

> Revalidate against current Arc docs and on-chain data before copying any value into config.
</script>

<script type="text/markdown" id="src-honeycoin">
# HoneyCoin — Off-Ramp API (Candidate LP)

*Status: `NEEDS_VALIDATION` · Evidence class: official public API reference · Accessed: 2026-09-29*

**Source:** [HoneyCoin API — Off-Ramp](https://docs.honeycoin.app/reference/crypto-off-ramp) (API v1.0.4, page updated 2026-05-28)

## What the API does
`POST https://crypto.honeycoin.app/api/minting/offramp` — "send tokens to an escrow address and get the value back in a number of different FIAT currencies." Auth is an API key in the `Authorization` header.

## Request (summary)
| Field | Required | Notes for MELO |
|---|---|---|
| `senderAmount` | yes | **`number` (double)**. Adapter must convert from integer base units and round deterministically; never feed floats back into core math |
| `senderCurrency` | yes | `USDC` / `USDT` |
| `receiverCurrency` | yes | Fiat, e.g. `NGN` |
| `chain` | yes | Enum: `eth`, `arb`, `base`, `matic`, `bsc`, `optimism`, `solana`, `tron`, `tempo`. **Arc is not listed** |
| `country` | yes | ISO-2, e.g. `NG` |
| `destination` | yes | Bank Account, MoMo, Paybill, Till |
| `payoutMethod` | yes | `accountName`, `accountNumber`, `code` (bank code, required for banks) |
| `externalReference` | yes | Our reconciliation ID. Map to MELO `fillId`, and check whether HoneyCoin rejects duplicates (idempotency) |
| `refundAddress` | no | Where funds go back if the payout fails; defaults to the sender. Must be on the same chain |
| `email` | no | Customer email; PII-minimise |

## Response (summary)
`transactionId`, `addressId`, `address` (per-order deposit address), `expiresAt` (ms epoch).

## Settlement model: provider deposit address
HoneyCoin gives you a **per-order deposit address**. The crypto goes into **HoneyCoin's custody first**, and the fiat payout follows. If the payout fails, the funds are returned to `refundAddress`.

This conflicts with MELO's **escrow-first, attestation-gated release** model (ADR-0003):
- Releasing escrow to `address` *before* payout evidence means the contract no longer guarantees "no release without verified payment".
- Waiting for payout evidence before releasing is impossible, because HoneyCoin pays out only after it receives the crypto.

See **ADR-0010** in the Decision Register for the options.

## Architectural implications
- **Provider adapter** — Add a `settlementRequirements` value such as `PROVIDER_DEPOSIT_ADDRESS { address, expiresAt, refundAddress }`, separate from `ESCROW_FIRST`.
- **Chain adapter** — Arc is unsupported. Using HoneyCoin in V1 would require an Arc → supported-chain route (e.g. CCTP to Base), which breaks the "Arc-only V1" scope. Needs an ADR.
- **Refund path** — Set `refundAddress` to a MELO-controlled escrow/refund contract, not the user's EOA, so refunds are reconciled against the intent.
- **Expiry** — `expiresAt` bounds the deposit window. Tie it to quote expiry and don't release escrow after it.
- **Status** — This endpoint doesn't document status lookup or webhooks. Find the payout-status and webhook endpoints in the rest of the API reference.

## Open questions for HoneyCoin
- Is Arc support planned? Timeline?
- Is `externalReference` enforced as unique (idempotent create)?
- What happens to a late deposit after `expiresAt`, or to a partial or over-deposit?
- What are the payout status lifecycle, webhook signing and replay protection?
- Is the NGN bank corridor live, and what are its limits, fees, rate lock and SLA?
- Does HoneyCoin support pay-first/prefunded payout (fiat before crypto), which would keep MELO's escrow model?
- What are the KYB and licensing requirements for Nigeria?
</script>

<script type="text/markdown" id="src-circle-ramps">
# Circle — USDC Fiat On/Off-Ramp Infrastructure

*Status: `NEEDS_VALIDATION` · Evidence class: vendor blog (marketing) · Accessed: 2026-09-29*

**Source:** [How USDC Provides New Fiat On & Off-Ramp Opportunities for Crypto Startups — Circle Blog](https://www.circle.com/blog/how-usdc-provides-new-fiat-on-off-ramp-opportunities-for-crypto-startups-1) (published 2021-08-25, updated 2024-10-01)

> This is a 2021 marketing article. Its product names (Circle Account, Payments, Payouts, Digital Accounts) have since moved to the **Circle Payments Network (CPN)**, Mint, Wallets, CCTP, Gateway and Paymaster. Treat it as background only; verify against current Circle docs.

## Relevant claims

- Payouts can be made in USDC or over traditional banking rails, and can be automated.
- Digital Accounts support sub-accounts, fund routing and "escrow-like options".

## Relevance to MELO

- If CCTP is used to reach non-Arc LPs, the chain adapter needs a **bridge step** with its own states: burn → attestation → mint. It must be idempotent and reconciled like any other side effect.

## Open questions
