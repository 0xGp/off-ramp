<script type="text/markdown" id="src-adr-0003">
# ADR-0003: Escrow Settlement Contract

```
Status: PROPOSED
Date: 2026-09-30
Decision owner: TBD
Reviewers: TBD (contract reviewer required)
Related: Protocol Invariants, Attestation Contract, ADR-0006, ADR-0007, ADR-0010, Chain Adapter Contract
```

## Context
MELO's core promise is escrow-first: user USDC is held by a contract, and only released once the fiat payout is verified, or refunded otherwise. The contract is the only component allowed to move escrowed funds, so it must enforce invariants 1–6 and 9 on its own. The backend database must never be able to release funds by itself (invariant 5).

## Decision drivers
- Release requires a verified attestation; refund and release are mutually exclusive.
- Funds must stay recoverable if the MELO backend disappears (Failure Modes: *Backend unavailable*).
- No bank PII onchain.
- Smallest possible trusted surface; testable with Hardhat fuzz/invariant tests.
- Must not depend on token features we have not verified on Arc.

## Options considered
### Option A — User-submitted deposit with MELO-signed terms
User approves USDC, then calls `deposit(terms, meloSig)`. `terms` are issued by the backend after quote lock and signed by a MELO *quote signer* key. The contract verifies the signature, expiry and `msg.sender == terms.depositor`, then pulls USDC with `transferFrom`.
- Benefits: user's own transaction is the authorization; uses only the standard ERC-20 interface; terms are bound onchain.
- Costs: two wallet transactions (approve + deposit) unless an allowance already exists.

### Option B — Relayed single-signature deposit (EIP-3009 / EIP-2612)
User signs one authorization; a MELO relayer submits `receiveWithAuthorization` or `permit` + deposit and pays gas.
- Benefits: one signature, closest to the current frontend prototype.
- Costs: depends on Arc USDC supporting EIP-3009/EIP-2612 — `NEEDS_VALIDATION`. Adds a relayer to operate and fund.

### Option C — Backend-controlled deposit address
Rejected: puts user funds in MELO custody before verification and contradicts escrow-first.

## Decision (proposed)
Adopt **Option A** for the testnet vertical slice. Keep Option B as a follow-up once Arc USDC authorization support is verified from official docs and chain data.

One non-upgradeable contract, `MeloEscrow`, holding per-intent records:

```solidity
struct DepositTerms {
  bytes32 intentId;
  address depositor;
  address token;               // Arc USDC via ERC-20 interface
  uint256 amount;              // base units (6 decimals via ERC-20 interface — verify)
  address payee;               // release destination, fixed at deposit (ADR-0010)
  bytes32 recipientCommitment; // hash(bankCode, account, salt); no PII onchain
  uint64  quoteExpiry;         // deposit must land before this
  uint64  refundAfter;         // permissionless refund from here (ADR-0007)
  uint256 nonce;
}

struct Attestation {
  bytes32 intentId;
  uint8   outcome;             // 1 = PAYOUT_SUCCEEDED -> release, 2 = PAYOUT_FAILED -> refund
  bytes32 evidenceHash;        // hash of provider reference + normalized evidence
  uint64  expiry;
  uint256 nonce;
}

function deposit(DepositTerms calldata t, bytes calldata meloSig) external;
function settle(Attestation calldata a, bytes[] calldata attestorSigs) external;
function refund(bytes32 intentId) external; // anyone, once block.timestamp >= refundAfter

event Deposited(bytes32 indexed intentId, address indexed depositor, uint256 amount);
event Released(bytes32 indexed intentId, address indexed payee, uint256 amount, bytes32 evidenceHash);
event Refunded(bytes32 indexed intentId, address indexed depositor, uint256 amount, uint8 reason);
```

*Illustrative — the final ABI is fixed only after review.*

Rules the contract enforces:
- State per intent: `NONE → ESCROWED → RELEASED | REFUNDED`. Terminal states are final.
- `payee` is fixed at deposit, so a compromised attestor can only release to the pre-agreed payee, never to an arbitrary address.
- `settle` verifies EIP-712 signatures (domain includes chain ID and contract address) against the attestor set and threshold from ADR-0006, and rejects expired or replayed attestations.
- `refund` after `refundAfter` needs no MELO involvement and cannot be blocked by pause.
- Pause blocks new deposits and `settle`, never timeout refunds.
- The contract uses only the ERC-20 interface of USDC. Native-USDC gas balance is never treated as escrow funds.
- No upgrade proxy for V1: changes ship as a new deployment, with the old contract left to drain.

## Consequences
- **Frontend:** the authorize step becomes "lock quote → approve → deposit" (two transactions) instead of a single typed-data signature. The status page reads escrow state from the backend projection fed by the indexer, never from the client's own transaction receipt.
- **Backend:** needs a quote-signer key (separate from attestor keys) and must issue terms only for a live, locked quote.
- **Risk:** a timeout refund after a payout that actually succeeded means MELO loses the fiat. `refundAfter` must exceed the provider's final-status SLA plus a reconciliation buffer (ADR-0007).
- **Operations:** every intent ends in exactly one onchain terminal event, which gives reconciliation an unambiguous anchor.

## Validation plan
- Hardhat unit, fuzz and invariant tests: no double release/refund; release XOR refund; wrong signer, expired or replayed attestation rejected; refund works while paused.
- Race tests: `settle` versus `refund` at the `refundAfter` boundary.
- Verify from official Arc docs: USDC ERC-20 address and decimals, finality, and gas behaviour.
- Independent contract review before any non-testnet deployment.

## Revisit triggers
Arc USDC supports EIP-3009 or EIP-2612 (enables Option B); split fills are required (ADR-0005); the chosen LP needs a different release sequence (ADR-0010).

## Implementation notes (`contracts/` v0.1, 2026-09-30)
*Status: `PROPOSED`, testnet only, not independently reviewed.*
- Targets: Arc Testnet (5042002) and Base Sepolia (84532). One bytecode, `evmVersion: cancun`, Solidity 0.8.34, OpenZeppelin 5.6.
- `nonce` fields dropped from `DepositTerms` and `Attestation`: each `intentId` can be used once per deployment, and the EIP-712 domain binds chain ID and contract address, which together prevent replay.
- `refundAfter` is bounded onchain to 30 min–24 h after deposit; the backend default is 2 h.
- Per-token deposit cap (`tokenMaxAmount`, 0 = not accepted) and `totalEscrowed` accounting; the owner can sweep only the surplus above `totalEscrowed`.
- `settle` stays valid after `refundAfter` while the intent is escrowed: the first of `settle`/`refund` wins, which reduces MELO's loss when a payout succeeded late.
- Attestor signatures must be distinct and sorted by signer address ascending.
- A USDC-blocklisted depositor or payee makes the transfer revert; funds stay escrowed (accepted behaviour, needs ops runbook).
- Arc specifics applied: ERC-20 interface only (6 decimals), no payable or `SELFDESTRUCT`, deploy script enforces `maxFeePerGas` ≥ 20 gwei.
- Arc mainnet status is `NEEDS_VALIDATION`: the docs index says "Testnet only" while the connect page lists mainnet chain 5042.
- 28 Hardhat tests pass: signature binding, cross-deployment replay, window bounds, balance-delta, pause, settle/refund race, blocklist, admin, randomized accounting invariants.
</script>

<script type="text/markdown" id="src-adr-0006">
# ADR-0006: Attestor Trust Model

```
Status: PROPOSED (testnet); mainnet model UNDECIDED
Date: 2026-09-30
Decision owner: TBD
Reviewers: TBD (security reviewer required)
Related: Attestation Contract, ADR-0003, ADR-0007, Threat Model
```

## Context
`MeloEscrow.settle` moves funds on the strength of attestor signatures. Whoever controls attestor keys controls escrow outcomes, bounded by the deposit-time `payee`. The handbook's Attestation Contract page lists the questions that must be answered first.

## What the attestation asserts
An attestation asserts exactly one of two facts about one intent:
1. **PAYOUT_SUCCEEDED** — the provider reported a *final* success status for the MELO payout reference, for at least the quoted `minNetFiat`, to the committed recipient.
2. **PAYOUT_FAILED** — the provider reported a *final* failure or reversal, and no duplicate payout exists for the intent.

It does **not** assert that the beneficiary's bank credited the funds; we have no bank-level evidence source today. `UNKNOWN`, pending or conflicting evidence produces **no attestation**. The intent goes to `RECONCILIATION_REQUIRED` and waits for resolution or the timeout refund.

## Options considered
- **A — Single signer key.** Simple, but a single point of compromise.
- **B — Threshold of MELO-operated keys (e.g. 2-of-3).** Resists one key leaking, but not a compromised MELO.
- **C — Independent quorum** (MELO plus an independent verifier or the LP). Strongest, but needs partners and governance.

## Decision (proposed)
- The contract verifies an **attestor set with a threshold** from day one, so moving from A to B or C is a configuration change, not a redeploy.
- **Testnet:** threshold 1, one attestor key held in a cloud KMS (signing through the KMS API; the key never leaves it). Never in `.env` files or the repo.
- **Mainnet gate:** at least Option B, with Option C evaluated during LP diligence. Mainnet stays `UNDECIDED` until the threat model review.
- **Governance:** the attestor set and threshold are changed by an admin multisig. Adding an attestor or lowering the threshold goes through a timelock; removing a compromised attestor takes effect immediately.
- **Binding:** attestations are EIP-712 typed data over `intentId`, `outcome`, `evidenceHash`, `expiry` and `nonce`, with a domain bound to chain ID and escrow address.
- **Evidence retention:** the attestor service stores the normalized evidence behind each `evidenceHash`, redacted and access-controlled, for audit and disputes.

## Consequences
- The attestor is a separate service with minimal permissions. It reads verified payout records and signs; it cannot trigger payouts.
- Every signing request, signature and rejection lands in the audit log with correlation IDs.
- Alert on signing failures, on unusual volume, and on attestations issued without a matching provider final status.

## Validation plan
Contract tests for set, threshold and rotation (including immediate removal); KMS signing integration test; a drill that rotates the testnet key end to end.

## Revisit triggers
The LP offers signed payout receipts (enables Option C evidence); regulatory guidance on who may attest; any key-custody incident.
</script>

<script type="text/markdown" id="src-adr-0008">
# ADR-0008: Database & Event Consistency

```
Status: PROPOSED
Date: 2026-09-30
Decision owner: TBD
Reviewers: TBD
Related: Data Model, Idempotency & Reconciliation, Failure Modes Matrix, Deployment Decisions
```

## Context
Three systems hold facts about a cash-out: the chain (escrow state), the provider (payout state) and MELO's Postgres (decisions and projections). None can be updated atomically with the others. We need at-least-once processing, no duplicate side effects, and a way to repair drift.

## Decision (proposed)
**Authority per fact.** The chain is authoritative for escrow state, and the provider for payout state. Postgres is authoritative only for MELO's own decisions (quotes issued, commands accepted). UI status is a projection derived from those sources.

**Intent aggregate.** An append-only `intent_events` table plus an `intents` projection, both written in the same transaction. Optimistic concurrency uses a `version` column, and every transition goes through the domain state machine.

**Transactional outbox.** Side effects (provider payout request, attestation request, notifications) are written as `outbox` rows in the same transaction as the state change. Workers claim rows with `FOR UPDATE SKIP LOCKED` and deliver at least once, so consumers must be idempotent. Failures back off, then go to a dead-letter status with alerting.

**Webhook inbox.**
- Verify the signature and timestamp window.
- Insert into `webhook_inbox` with `UNIQUE (provider, provider_event_id)`, then return 2xx.
- Process asynchronously; a duplicate insert is a no-op.

**Chain indexer.**
- Keep a cursor per `(chain_id, contract)`, and store events with `UNIQUE (chain_id, tx_hash, log_index)`.
- Only process blocks the finality policy considers final (Arc finality is `NEEDS_VALIDATION`).
- Replaying from any cursor is safe because of the uniqueness constraint.

**Client idempotency.** `idempotency_records (user_id, key)` stores a request hash and response snapshot. The same key with a different body returns `validation`, and records expire after 24h.

**Queue technology.** Postgres only (outbox plus `SKIP LOCKED`) for V1: no Redis or Kafka until measured load requires it.

**Reconcilers.** Scheduled jobs compare:
- escrow events with intent projections;
- stale payouts with provider status lookups;
- attestations with evidence.

A mismatch moves the intent to `RECONCILIATION_REQUIRED` and alerts; there is never a silent auto-fix.

## Consequences
- One database to operate, back up (PITR) and reason about; simpler local and CI setup.
- Outbox latency is seconds, not milliseconds, which is acceptable for this flow.
- Every worker must be idempotent and restart-safe; this is tested by killing workers mid-batch.

## Validation plan
Integration tests against real Postgres covering duplicate webhooks, out-of-order webhooks, indexer replay from genesis, a worker crash between claim and ack, and an injected mismatch that the reconciler must catch.

## Revisit triggers
Sustained outbox lag, multi-region requirements, or event fan-out to many consumers.
</script>

<script type="text/markdown" id="src-adr-0010">
# ADR-0010: Settlement Sequencing per LP

```
Status: PROPOSED (contract shape); LP choice UNDECIDED
Date: 2026-09-30
Decision owner: TBD
Reviewers: TBD (legal/commercial review required)
Related: ADR-0003, ADR-0009, LP Selection, HoneyCoin research
```

## Context
Escrow-first release (ADR-0003) means crypto leaves escrow only *after* the payout is verified. Many LPs, HoneyCoin included, want crypto at their deposit address *before* paying out. Something has to give: sequencing, custody, or credit exposure.

## Options considered
- **A — Pay-first LP.** The LP pays naira from its own float; escrow releases to the LP's address after attestation. Cleanest fit, but depends on LP willingness and pricing.
- **B — Release-before-payout under a credit limit.** Escrow releases to the LP first, with a per-LP exposure cap. This contradicts attestation-gated release and needs a different contract.
- **C — MELO-prefunded float.** MELO keeps a float with the LP and pays out from it; escrow releases to a MELO treasury address after attestation. Works with deposit-first LPs, but MELO carries float and custody obligations.

## Decision (proposed)
- `MeloEscrow` supports **A and C** through the deposit-time `payee` field (LP settlement address, or MELO treasury).
- **B is excluded** from the V1 contract, because it breaks invariant 1.
- **Testnet vertical slice:** a sandbox provider with `payee` = a MELO testnet treasury address (the C shape), since sandbox payouts involve no real float.
- **Commercial choice between A and C:** deferred to ADR-0009 LP diligence. Each LP is asked directly whether it supports pay-first.

## Consequences
- Option C likely makes MELO a party that receives user crypto and pays fiat, which may have licensing and custody implications. Legal review is required before mainnet.
- Treasury float needs its own monitoring (balance, top-up alerts) and reconciliation against LP statements.
- A per-LP `payee` allowlist on the backend stops terms from being issued with an arbitrary payee.

## Validation plan
LP answers on pay-first support and float terms; legal opinion on Option C; a treasury reconciliation drill on testnet.

## Revisit triggers
The LP offers pay-first with acceptable pricing (prefer A); legal advice rules out C; the LP requires B-style sequencing (needs a new ADR and contract design).
</script>

<script type="text/markdown" id="src-adr-0012">
# ADR-0012: Account Wallets for Intake (Privy)

```
Status: PROPOSED (model chosen by product owner 2026-09-30; vendor details NEEDS_VALIDATION)
Date: 2026-09-30
Decision owner: Product owner
Reviewers: TBD (security review of signer policies before mainnet)
Related: ADR-0003, ADR-0006, ADR-0007, ADR-0008, ADR-0010, Frontend Boundary
```

## Context
The v0.1 flow requires connecting an external wallet, switching network and signing on every cash-out. The target user often holds USDC on an exchange and cashes out repeatedly. The priority is **least human time per cash-out** and a clean, fintech-like UX.

## Options considered
- **A · Per-intent CREATE2 deposit address, no login.** Each cash-out gets a precomputed contract address that can only flush into `MeloEscrow` or refund. It is correct and needs no account, but every cash-out repeats amount, bank, refund address, copy and send (about 2–3 min). It also needs deposit windows, amount-tolerance rules, late-deposit handling, a refund-address field, a relayer and a contract v0.2. **Rejected for V1**; kept as a possible future "guest checkout".
- **B · Privy account wallet (chosen).** The user signs in with Google. Privy creates a non-custodial embedded wallet, which becomes her **permanent USDC address**. She saves a verified bank account once, funds the address any time, and cashes out from her balance with one tap.
- **C · Shared escrow address with exact-amount matching.** Rejected: amount collisions, exchange fees, unattributable resends, and plain transfers bypass `MeloEscrow.deposit`.

## Decision (product owner, 2026-09-30)
1. **Sign-in:** Google only in V1, via Privy.
2. **Wallet:** a Privy embedded EVM wallet per user, with the same address on Arc and Base. Arc is configured as a custom chain (`defineChain`). Privy documents support for any EVM chain via `supportedChains` (docs.privy.io, accessed 2026-09-30).
3. **Bank account:** saved on the profile after a Paycrest name check. It can be changed, with a fresh re-authentication, an email alert and a 24 h cooling-off period before a new account receives payouts (PROPOSED).
4. **Cash-out:** one tap from the balance. The embedded wallet calls the **existing** `MeloEscrow.deposit` with MELO-signed terms, so there is no contract change and the current Arc Testnet and Base Sepolia deployments remain valid. Settlement and refund are unchanged (ADR-0003). A refund returns USDC to the user's own wallet.
5. **Auto cash-out on arrival:** deferred. When built, it is opt-in and uses a Privy server-held signer whose policy allows only `MeloEscrow` calls, on our chain IDs, up to the user's limit. Privy documents per-signer policies restricting contracts, calldata, chains and amounts.

## Why B is fastest and simplest
- **Human time:** about 1 min the first time (Google, save bank, fund); after that, a tap. Option A costs 2–3 min every time.
- **No refund-address field.** A refund goes to her own wallet.
- **No deposit window, tolerance rules or late deposits.** She cashes out from a balance that is already there, so the amount is exact.
- **No FX-lock risk while waiting for a transfer.** The quote is taken when the funds are already in hand.
- **No contract v0.2 and no relayer for intake.**
- **Identity per user** makes limits and Paycrest's sender questions tractable.

## Gas
- **Arc:** gas is paid in USDC from the user's own balance, so no sponsorship is needed. Show a "network fee ~$0.0x" line on the quote.
- **Base:** gas is ETH. Use Privy gas sponsorship; Base is on Privy's supported list. Sponsorship for custom chains may require contacting Privy, which is irrelevant for Arc.

## Risks and mitigations
- **Account takeover redirecting payouts:** re-authenticate, alert and cool off on bank changes; per-user daily limits; a new device needs a Google re-login.
- **Vendor dependency:** Privy pricing, limits and uptime are NEEDS_VALIDATION. Users can export keys, so funds are never locked in.
- **Deposit on the wrong network:** the same address exists on every EVM chain. Funds sent on an unsupported chain are recoverable by the user through key export. Show a clear "Arc or Base only" note.
- **Compliance:** sanctions screening of incoming transfer senders; limits per user and per bank account.

## Architecture impact
- **Frontend:** RainbowKit and wagmi wallet-connect are replaced by the Privy provider.
  - Screens: sign-in; home (balance per chain, "Add USDC" with QR/address, "Cash out"); bank setup; quote with one-tap confirm; tracker.
  - The chain picker remains ("USDC on Arc" / "USDC on Base").
- **Backend (TypeScript, Postgres, separate repo):**
  - Privy token verification and a `users` table keyed by Privy user ID and wallet address;
  - quotes and the quote signer; intents;
  - a deposit watcher (USDC `Transfer` logs to user wallets, for the balance and activity feed, and `MeloEscrow.Deposited` for intents);
  - a Paycrest payout worker (Base treasury, ADR-0010 Option C), a webhook inbox, an attestor `settle` job, and a reconciler.
- **Contracts:** none for V1 intake.

## Build plan

| Phase | Scope | Done when |
|---|---|---|
| 1 · Backend skeleton | Repo, Postgres migrations, job runner on Postgres; Privy auth verification; `users`, `bank_accounts`, `quotes`, `intents` | Signed-in user can save a verified bank account via the API |
| 2 · Quote + deposit | Paycrest rate quote; MELO-signed `DepositTerms`; frontend one-tap deposit from the Privy wallet | USDC locked in `MeloEscrow` on both testnets from the app |
| 3 · Watcher | Indexer for `Deposited` / `Released` / `Refunded` plus USDC transfers to user wallets; cursors; confirmations | Intent moves to ESCROWED automatically; balance feed accurate |
| 4 · Payout + settle | Paycrest adapter (simulator until KYB), webhook inbox (HMAC), attestor `settle` / refund | Settled releases to treasury; failure refunds the user |
| 5 · Frontend | Privy sign-in (Google), home balance, Add USDC, bank setup, cash-out, tracker; remove RainbowKit | Full flow on both testnets with no external wallet |
| 6 · Operations | Limits, bank-change cooling-off, sanctions screening, reconciler, metrics | Injected mismatch detected; limits enforced |

## Validation plan
- Privy: Arc custom chain works for the embedded wallet; confirm Base Sepolia sponsorship; confirm pricing tier and server-signer policies.
- Paycrest: sender-KYC requirements during KYB.

## Revisit triggers
One-time users dominate (build Option A as guest checkout); Privy pricing or limits unacceptable; Privy cannot support Arc embedded wallets; legal advice on auto cash-out.
</script>

const FLAT = NAV.flatMap(g => g.items.map(it => ({...it, group:g.title})));
const STATUS_LABEL = {idea:"IDEA",proposed:"PROPOSED",undecided:"UNDECIDED",needs_validation:"NEEDS VALIDATION",in_review:"IN REVIEW",approved:"APPROVED",implemented:"IMPLEMENTED",verified:"VERIFIED",deprecated:"DEPRECATED",blocked:"BLOCKED"};

function buildNav(filter){
  const root = document.getElementById('navroot');
  root.innerHTML = '';
  NAV.forEach(group=>{
    const items = group.items.filter(it => !filter || it.label.toLowerCase().includes(filter.toLowerCase()));
    if(!items.length) return;
    const g = document.createElement('div'); g.className='navgroup';
    const h = document.createElement('h2'); h.textContent = group.title; g.appendChild(h);
    items.forEach(it=>{
      const el = document.createElement('div');
      el.className = 'navitem'; el.id = 'nav-'+it.id;
      el.innerHTML = `<span class="navdot st-${it.status}"></span><span>${it.label}</span>`;
      el.onclick = ()=>{ navigate(it.id); toggleSidebar(false); };
      g.appendChild(el);
    });
    root.appendChild(g);
  });
}
function filterNav(v){ buildNav(v); }

function mdToHtml(id){
  const src = document.getElementById('src-'+id);
  if(!src) return '<p>Section not found.</p>';
  return marked.parse(src.textContent);
}

function statusBar(status){
  const label = STATUS_LABEL[status] || status.toUpperCase();
  return `<span class="badge"><span class="dot navdot st-${status}"></span>${label}</span>`;
}

function navigate(id){
  const item = FLAT.find(f=>f.id===id) || FLAT[0];
  document.getElementById('content').innerHTML = mdToHtml(item.id);
  document.getElementById('statusbar').innerHTML = statusBar(item.status) + `<span class="badge">${item.group}</span>`;
  document.getElementById('crumb').textContent = 'MELO / ' + item.group + ' / ' + item.label;
  document.querySelectorAll('.navitem').forEach(n=>n.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id); if(navEl) navEl.classList.add('active');

  const idx = FLAT.findIndex(f=>f.id===id);
  const prev = FLAT[idx-1], next = FLAT[idx+1];
  document.getElementById('pagenav').innerHTML =
    (prev ? `<a onclick="navigate('${prev.id}')"><span class="lbl">← Previous</span>${prev.label}</a>` : '<span></span>') +
    (next ? `<a onclick="navigate('${next.id}')"><span class="lbl">Next →</span>${next.label}</a>` : '<span></span>');

  try{ localStorage.setItem('melo-wb-last', id); }catch(e){}
  window.scrollTo(0,0);
  document.getElementById('mainwrap').scrollTo(0,0);
}

function toggleSidebar(force){
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  const open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}

function toggleTheme(){
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  let next;
  if(!cur){
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    next = prefersDark ? 'light' : 'dark';
  } else {
    next = cur === 'dark' ? 'light' : 'dark';
  }
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('melo-wb-theme', next); }catch(e){}
}

(function init(){
  try{
    const t = localStorage.getItem('melo-wb-theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
  buildNav('');
  let start = 'readme';
  try{ const last = localStorage.getItem('melo-wb-last'); if(last && FLAT.find(f=>f.id===last)) start = last; }catch(e){}
  navigate(start);
})();
